name: Deploy Frontend To GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for project pages
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PLATFORM_ADMIN_EMAILS: ${{ secrets.VITE_PLATFORM_ADMIN_EMAILS }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages via git
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd frontend
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create authenticated git URL
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          # Fetch or create gh-pages branch
          git fetch origin gh-pages --depth=1 2>/dev/null || echo "gh-pages branch does not exist yet"
          git checkout -b gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages
          
          # Clear old content and add new build
          rm -rf .git/index
          git clean -fdx
          cp -r dist/* .
          git add -A
          
          # Commit and push
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from commit ${{ github.sha }}"
            git push origin gh-pages --force
          fi
          echo "page_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
